// ===================================================================
//  Katanalı Eşekler — canvas düello animasyonu
// ===================================================================
const W = 1280, H = 720, GY = 588, STEP = 1 / 120, LOOP_END = 26.6;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#12101a';

function resize() {
  const ww = innerWidth, wh = innerHeight;
  let w = ww, h = ww * 9 / 16;
  if (h > wh) { h = wh; w = wh * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
addEventListener('resize', resize); resize();

// ---------------- yardımcılar ----------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const E = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  snap: t => 1 - Math.pow(1 - t, 5),
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// iki kemikli IK; bend=+1 dirsek aşağı, -1 diz öne
function ik2(ax, ay, tx, ty, l1, l2, bend) {
  let dx = tx - ax, dy = ty - ay, d = Math.hypot(dx, dy) || 1e-3;
  const mx = l1 + l2 - .5, mn = Math.abs(l1 - l2) + 1;
  if (d > mx) { dx *= mx / d; dy *= mx / d; d = mx; } else if (d < mn) { dx *= mn / d; dy *= mn / d; d = mn; }
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const bx = ax + dx * a / d, by = ay + dy * a / d;
  return { ex: bx + bend * (-dy / d) * h, ey: by + bend * (dx / d) * h, hx: ax + dx, hy: ay + dy };
}

function segHit(a, b, c, d) {
  const r = { x: b.x - a.x, y: b.y - a.y }, s = { x: d.x - c.x, y: d.y - c.y };
  const den = r.x * s.y - r.y * s.x; if (Math.abs(den) < 1e-6) return null;
  const t = ((c.x - a.x) * s.y - (c.y - a.y) * s.x) / den, u = ((c.x - a.x) * r.y - (c.y - a.y) * r.x) / den;
  return (t >= 0 && t <= 1 && u >= 0 && u <= 1) ? { x: a.x + r.x * t, y: a.y + r.y * t } : null;
}

// ---------------- ses (WebAudio ile sentez) ----------------
let SILENT = false;
const SFX = (() => {
  let ac, out, nb, on = false, windG;
  function init() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const master = ac.createGain(); master.gain.value = .75; master.connect(ac.destination);
    const len = ac.sampleRate * 1.8, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    const rev = ac.createConvolver(); rev.buffer = ir;
    const rg = ac.createGain(); rg.gain.value = .22; rev.connect(rg); rg.connect(master);
    out = ac.createGain(); out.connect(master); out.connect(rev);
    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // rüzgâr
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const bf = ac.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 420; bf.Q.value = .6;
    windG = ac.createGain(); windG.gain.value = .05;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .13; lg.gain.value = .03;
    lfo.connect(lg); lg.connect(windG.gain); lfo.start();
    s.connect(bf); bf.connect(windG); windG.connect(out); s.start();
  }
  const ok = () => on && ac && !SILENT;
  function tone(f, dur, type, vol, delay, f1) {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
  }
  function nz(dur, type, f0, f1, q, vol, delay) {
    const t = ac.currentTime + (delay || 0), s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const bf = ac.createBiquadFilter(); bf.type = type; bf.frequency.setValueAtTime(f0, t); if (f1) bf.frequency.exponentialRampToValueAtTime(f1, t + dur); bf.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.02, dur / 3)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(bf); bf.connect(g); g.connect(out); s.start(t, Math.random()); s.stop(t + dur + .05);
  }
  return {
    toggle() { init(); if (ac.state === 'suspended') ac.resume(); on = !on; if (windG) windG.gain.value = on ? .05 : 0; return on; },
    get on() { return on; },
    clang(p = 1) { if (!ok()) return; nz(.06, 'highpass', 3200, 0, .7, .45 * p); [1210, 1830, 2790, 4210, 5630].forEach((f, i) => tone(f * rnd(.97, 1.03), .3 + .5 * p / (i + 1), 'sine', .13 * p / (i * .6 + 1), 0)); },
    swoosh(p = 1, d = .26) { if (!ok()) return; nz(d, 'bandpass', 500, 2600, 1.1, .22 * p); },
    thud(p = 1) { if (!ok()) return; tone(140, .4, 'sine', .8 * p, 0, 38); nz(.14, 'lowpass', 800, 180, .7, .5 * p); },
    taiko(p = 1) { if (!ok()) return; tone(170, .55, 'sine', .9 * p, 0, 52); nz(.09, 'bandpass', 320, 110, .9, .35 * p); },
    pluck(f) { if (!ok()) return; tone(f, .7, 'triangle', .13, 0, f * .995); tone(f * 2, .35, 'sine', .04, 0); },
    shing() { if (!ok()) return; nz(.55, 'highpass', 2500, 9000, .5, .13); tone(3300, .5, 'sine', .04, 0, 6200); },
    ting() { if (!ok()) return; tone(2400, .16, 'square', .06, 0, 1800); tone(3700, .3, 'sine', .08, 0); },
    heehaw(k = 1) {
      if (!ok()) return;
      const t = ac.currentTime, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      const v = ac.createOscillator(), vg = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(330 * k, t); o.frequency.exponentialRampToValueAtTime(800 * k, t + .38);
      o.frequency.setValueAtTime(640 * k, t + .42); o.frequency.exponentialRampToValueAtTime(230 * k, t + 1.05);
      f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 2.2;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .08); g.gain.setValueAtTime(.3, t + .38);
      g.gain.exponentialRampToValueAtTime(.05, t + .41); g.gain.exponentialRampToValueAtTime(.32, t + .5); g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
      v.frequency.value = 8; vg.gain.value = 16 * k; v.connect(vg); vg.connect(o.frequency);
      o.connect(f); f.connect(g); g.connect(out); o.start(t); v.start(t); o.stop(t + 1.2); v.stop(t + 1.2);
    }
  };
})();

function compile(keys) {
  const tr = {};
  for (const [t, o, e] of keys) for (const k in o) (tr[k] || (tr[k] = [])).push([t, o[k], e]);
  return tr;
}
function evalTrack(a, T) {
  if (!a) return 0;
  if (T <= a[0][0]) return a[0][1];
  for (let i = 1; i < a.length; i++) if (T < a[i][0]) {
    const p = a[i - 1], q = a[i], u = (T - p[0]) / (q[0] - p[0]);
    return lerp(p[1], q[1], E[q[2]](u));
  }
  return a[a.length - 1][1];
}

// ---------------- poz hesabı ve iskelet ----------------
function pose(f, dt) {
  const p = f.p;
  for (const k in BASE) p[k] = evalTrack(f.tr[k], T);
  const br = Math.sin(T * 2.6 + f.id * 1.7);
  p.crouch += br * 1.6 * (p.fall > .1 ? 0 : 1);
  if (p.hit !== undefined) p.hit = 0;
  p.sa += Math.sin(T * 3.1 + f.id) * .014;
  p.x += p.jit * Math.sin(T * 70 + f.id * 2) * 2.4;
  p.crouch += p.jit * Math.sin(T * 53 + f.id) * 1.6;
  if (f.hit > .01) { p.lean -= f.hit * .25; p.x -= f.hit * 10 * Math.sign(p.face || 1); p.ears = Math.min(1, p.ears + f.hit); f.hit *= Math.exp(-7 * (dt || .008)); }
  // yürüyüş çevrimi
  if (dt) {
    f.vx = f.px === null ? 0 : (p.x - f.px) / dt; f.px = p.x;
    const air = p.y > 2 || p.fall > .1;
    f.wa = lerp(f.wa, air ? 0 : clamp(Math.abs(f.vx) / 120, 0, 1), .15);
    f.ph += Math.min(Math.abs(f.vx), 260) * dt * .055;
  }
  p.l1x += Math.cos(f.ph) * 16 * f.wa; p.l1y += Math.max(0, Math.sin(f.ph)) * 20 * f.wa;
  p.l2x -= Math.cos(f.ph) * 16 * f.wa; p.l2y += Math.max(0, -Math.sin(f.ph)) * 20 * f.wa;
  f.sx = p.face * Math.cos(p.turn);
  if (Math.abs(f.sx) < .05) f.sx = .05 * (f.sx < 0 ? -1 : 1);
  f.lift = Math.sin(clamp(p.fall, 0, 1.57)) * 30;
  f.wx = p.x; f.wy = GY - p.y - f.lift;
}

function rig(f) {
  const p = f.p, j = f.j, BL = 158;
  const ph = 98 - p.crouch, sL = Math.sin(p.lean), cL = Math.cos(p.lean);
  j.pel = { x: 0, y: -ph };
  const sh = { x: sL * 82, y: -ph - cL * 82 }, sh2 = { x: sh.x - 7, y: sh.y - 2 };
  j.sh = sh; j.sh2 = sh2;
  j.nk = { x: sL * 100, y: -ph - cL * 100 };
  j.ha = p.lean * .55 + p.head;
  const a1 = ik2(sh.x, sh.y, sh.x + p.hx, sh.y + p.hy, 46, 44, 1);
  j.eN = { x: a1.ex, y: a1.ey }; j.hN = { x: a1.hx, y: a1.hy };
  let t2;
  if (f.hasSword) {
    const dx = Math.cos(p.sa), dy = Math.sin(p.sa);
    j.dir = { x: dx, y: dy };
    j.G = { x: j.hN.x + dx * 12, y: j.hN.y + dy * 12 };
    j.pom = { x: j.hN.x - dx * 40, y: j.hN.y - dy * 40 };
    t2 = { x: j.hN.x - dx * 20, y: j.hN.y - dy * 20 };
    // kıvrımlı kılıç: uç, sırt tarafına doğru kayar
    j.tip = { x: j.G.x + dx * BL + dy * 10, y: j.G.y + dy * BL - dx * 10 };
  } else t2 = { x: j.hN.x + p.hx2, y: j.hN.y + p.hy2 };
  const a2 = ik2(sh2.x, sh2.y, t2.x, t2.y, 46, 44, 1);
  j.eF = { x: a2.ex, y: a2.ey }; j.hF = { x: a2.hx, y: a2.hy };
  // bacaklar
  const hipN = { x: 3, y: -ph }, hipF = { x: -3, y: -ph };
  const L1 = ik2(hipN.x, hipN.y, p.l1x, -p.l1y - 10, 54, 56, -1), L2 = ik2(hipF.x, hipF.y, p.l2x, -p.l2y - 10, 54, 56, -1);
  j.legN = { hip: hipN, knee: { x: L1.ex, y: L1.ey }, ank: { x: L1.hx, y: L1.hy } };
  j.legF = { hip: hipF, knee: { x: L2.ex, y: L2.ey }, ank: { x: L2.hx, y: L2.hy } };
}
function toWorld(f, lx, ly) {
  const a = -f.p.fall, ca = Math.cos(a), sa = Math.sin(a);
  return { x: f.wx + (lx * ca - ly * sa) * f.sx, y: f.wy + lx * sa + ly * ca };
}
function headPt(f, x, y) {
  const j = f.j, c = Math.cos(j.ha), s = Math.sin(j.ha);
  return { x: j.nk.x + x * c - y * s, y: j.nk.y + x * s + y * c };
}
const bladeSeg = f => f.hasSword ? [toWorld(f, f.j.G.x, f.j.G.y), toWorld(f, f.j.tip.x, f.j.tip.y)] : null;

// iki bıçağın en yakın noktası / kesişimi
function clashPoint() {
  const a = bladeSeg(F[0]), b = bladeSeg(F[1]);
  if (!a || !b) return { x: 640, y: 400 };
  const h = segHit(a[0], a[1], b[0], b[1]); if (h) return h;
  let best = 1e9, bp = null;
  for (let i = 0; i <= 14; i++) for (let k = 0; k <= 14; k++) {
    const pa = { x: lerp(a[0].x, a[1].x, i / 14), y: lerp(a[0].y, a[1].y, i / 14) }, pb = { x: lerp(b[0].x, b[1].x, k / 14), y: lerp(b[0].y, b[1].y, k / 14) };
    const d = Math.hypot(pa.x - pb.x, pa.y - pb.y); if (d < best) { best = d; bp = { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 }; }
  }
  return bp;
}

  for (const d of decals) { c.save(); c.translate(d.x, GY + 4); c.strokeStyle = 'rgba(8,4,12,.85)'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(-90, 2); c.lineTo(-52, -2); c.lineTo(-20, 4); c.lineTo(10, 0); c.lineTo(46, 5); c.lineTo(96, 1); c.moveTo(-20, 4); c.lineTo(-30, 16); c.moveTo(10, 0); c.lineTo(22, -9); c.stroke(); c.restore(); }
  // gölgeler
  for (const f of F) { const lie = f.p.fall > 1 ? 1 : 0, a = .38 * (1 - clamp(f.p.y / 260, 0, .8)); c.fillStyle = `rgba(6,3,12,${a})`; c.beginPath(); c.ellipse(f.wx + lie * 60 * f.sx * -1, GY + 6, (62 + lie * 90) * (1 - clamp(f.p.y / 700, 0, .4)), 12, 0, 0, 6.283); c.fill(); }
  // saplanmış / uçan kılıç
  if (thrown) { c.save(); c.translate(thrown.x, thrown.y); c.rotate(thrown.a); drawSword(c, { x: -62, y: 0 }, 0, 158); c.restore(); }
  drawGhosts();
  const order = F[0].p.x < F[1].p.x ? [F[1], F[0]] : [F[0], F[1]];
  for (const f of order) drawDonkey(c, f);
  for (const f of F) {
    drawRope(f.ropes[0], f.skin.band, 7.4); drawRope(f.ropes[1], f.skin.band, 7.4);
  }
  for (const r of loose) drawRope(r, r.col, 7.2);
  drawTrails();
  // bıçak parıltısı
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const f of F) if (f.hasSword) { const u = ((T * .9 + f.id * .37) % 1.6); if (u < 1) { const g = toWorld(f, f.j.G.x + f.j.dir.x * 158 * u, f.j.G.y + f.j.dir.y * 158 * u - 10 * u * u); star4(g.x, g.y, 5 * Math.sin(u * Math.PI), 'rgba(255,255,255,.95)'); } }
  c.restore();
  drawParticles();
  if (fx.cutLine) {
    const t = (realNow - fx.cutLine.t0), a = clamp(1 - t / 1.4, 0, 1);
    if (a > 0) { c.save(); c.globalCompositeOperation = 'lighter'; const w = 6 + 26 * Math.exp(-t * 6); c.fillStyle = `rgba(255,255,255,${a})`; c.beginPath(); c.moveTo(fx.cutLine.x - 460, fx.cutLine.y - 250); c.lineTo(fx.cutLine.x + 460, fx.cutLine.y + 250); c.lineTo(fx.cutLine.x + 460 - w * .6, fx.cutLine.y + 250 + w); c.lineTo(fx.cutLine.x - 460 + w * .6, fx.cutLine.y - 250 - w); c.closePath(); c.fill(); c.restore(); }
  }
  c.restore();
  // ön plan
  c.save(); c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-cam.cx, -cam.cy); drawPetals(true); c.restore();
  L(BG.fg, 1.35, 1.35);
}

// ---------------- HUD ve yazılar ----------------
function bigText(txt, x, y, size, col, alpha, scale, stroke) {
  const c = ctx; c.save(); c.translate(x, y); c.scale(scale || 1, scale || 1); c.globalAlpha = alpha;
  c.font = `900 italic ${size}px "Arial Black",Impact,Haettenschweiler,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = size * .14; c.strokeStyle = stroke || INK; c.strokeText(txt, 0, 0);
  const g = c.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, '#fff'); g.addColorStop(.55, col); g.addColorStop(1, col); c.fillStyle = g; c.fillText(txt, 0, 0); c.restore();
}
function hpBar(f, x, right, hudA) {
  const c = ctx, w = 470, h = 22, y = 36, sk = 16;
  c.save(); c.globalAlpha = hudA; c.translate(x, y);
  if (right) { c.translate(w, 0); c.scale(-1, 1); }
  c.fillStyle = 'rgba(10,8,18,.72)'; c.beginPath(); c.moveTo(0, 0); c.lineTo(w, 0); c.lineTo(w - sk, h); c.lineTo(-sk, h); c.closePath(); c.fill();
  const pct = f.hpShow / 100, tp = f.hpTrail / 100;
  const bar = (v, col) => { if (v <= 0) return; c.fillStyle = col; c.beginPath(); c.moveTo(3, 3); c.lineTo(3 + (w - 6) * v, 3); c.lineTo(3 + (w - 6) * v - sk * .8, h - 3); c.lineTo(3 - sk * .8, h - 3); c.closePath(); c.fill(); };
  bar(tp, '#ffd23f'); const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, f.hpShow > 35 ? '#7dff9a' : '#ff8a6a'); g.addColorStop(1, f.hpShow > 35 ? '#1fb85a' : '#d6361f'); bar(pct, g);
  c.strokeStyle = '#e8c35a'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(0, 0); c.lineTo(w, 0); c.lineTo(w - sk, h); c.lineTo(-sk, h); c.closePath(); c.stroke();
  c.restore();
  c.save(); c.globalAlpha = hudA; c.font = '900 italic 17px "Arial Black",Impact,sans-serif'; c.textAlign = right ? 'right' : 'left'; c.fillStyle = '#fff'; c.strokeStyle = INK; c.lineWidth = 4; c.lineJoin = 'round';
  const tx = right ? x + w : x; c.strokeText(f.skin.name, tx, y + 42); c.fillText(f.skin.name, tx, y + 42); c.restore();
}
function drawUI(cam) {
  const c = ctx, t = T;
  // sinematik bantlar
  if (cam.bars > .001) { const bh = 62 * cam.bars; c.fillStyle = '#000'; c.fillRect(0, 0, W, bh); c.fillRect(0, H - bh, W, bh); }
  // hız çizgileri
  const sl = clamp(Math.abs(F[0].vx) / 3000, 0, 1) * (t > 18 && t < 18.8 ? 1 : 0) + fx.sl;
  if (sl > .02) { c.save(); c.strokeStyle = `rgba(255,255,255,${(.5 * sl).toFixed(2)})`; c.lineWidth = 1.6; for (let i = 0; i < 46; i++) { const a = rnd(0, 6.283), r0 = rnd(300, 560), r1 = r0 + rnd(80, 300); c.beginPath(); c.moveTo(640 + Math.cos(a) * r0 * 1.4, 360 + Math.sin(a) * r0 * .8); c.lineTo(640 + Math.cos(a) * r1 * 1.4, 360 + Math.sin(a) * r1 * .8); c.stroke(); } c.restore(); }
  // vinyet
  const vg = c.createRadialGradient(640, 370, 300, 640, 370, 780); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  if (fx.flash > .01) { c.fillStyle = `rgba(255,248,235,${clamp(fx.flash, 0, 1)})`; c.fillRect(0, 0, W, H); }
  if (realNow < fx.invert) { c.save(); c.globalCompositeOperation = 'difference'; c.fillStyle = '#fff'; c.fillRect(0, 0, W, H); c.restore(); }
  // HUD
  const hudA = clamp((t - 4.4) / .6, 0, 1) * (t > 24.6 ? clamp(1 - (t - 24.6) / .6, 0, 1) : 1);
  if (hudA > 0) {
    hpBar(F[0], 62, false, hudA); hpBar(F[1], 748, true, hudA);
    const tm = t < 5 ? 99 : t > 20.7 ? 41 : Math.max(41, 99 - Math.floor((t - 5) * 3.7));
    c.save(); c.globalAlpha = hudA; c.fillStyle = 'rgba(10,8,18,.8)'; c.strokeStyle = '#e8c35a'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(640, 24); c.lineTo(676, 52); c.lineTo(640, 80); c.lineTo(604, 52); c.closePath(); c.fill(); c.stroke();
    c.font = '900 italic 28px "Arial Black",Impact,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(String(tm), 640, 54); c.restore();
  }
  // yazılar
  if (t < 3.3) { const a = t < 2.2 ? 1 : clamp(1 - (t - 2.2) / 1.1, 0, 1); c.fillStyle = `rgba(4,5,12,${(.82 * a).toFixed(2)})`; c.fillRect(0, 0, W, H);
    const k = E.out(clamp(t / 1.2, 0, 1)); bigText('KATANALI EŞEKLER', 640, 330, 86, '#ffd25a', a * k, .9 + .1 * k);
    c.save(); c.globalAlpha = a * clamp((t - .6) / .8, 0, 1); c.font = 'italic 24px Georgia,serif'; c.textAlign = 'center'; c.fillStyle = '#e8dcc8'; c.fillText('~  nihai düello  ~', 640, 404); c.restore(); }
  if (t > 4.3 && t < 5.3) bigText('RAUND 1', 640, 330, 70, '#fff', clamp((t - 4.3) / .2, 0, 1) * clamp((5.3 - t) / .3, 0, 1), 1 + (t - 4.3) * .1);
  if (t >= 5.0 && t < 6.5) { const u = t - 5.0, s = u < .18 ? lerp(2.6, 1, E.out(u / .18)) : 1 + (u - .18) * .05; bigText('DÖVÜŞ!', 640, 330, 130, '#ff4d3a', clamp((6.5 - t) / .5, 0, 1), s); }
  if (t >= 20.55 && t < 22.3) { const u = t - 20.55, s = u < .2 ? lerp(3, 1, E.out(u / .2)) : 1 + (u - .2) * .06; bigText('K.O.', 640, 300, 190, '#ff3b30', clamp((22.3 - t) / .4, 0, 1), s); }
  if (t >= 21.9 && t < 24.9) { const u = t - 21.9, a = clamp(u / .4, 0, 1) * clamp((24.9 - t) / .5, 0, 1); bigText('MUSASHİ EŞEK KAZANDI!', 640, 150, 54, '#ffd25a', a, .94 + .06 * E.out(clamp(u / .5, 0, 1)));
    c.save(); c.globalAlpha = a * .9; c.font = 'italic 22px Georgia,serif'; c.textAlign = 'center'; c.fillStyle = '#f1e6d2'; c.fillText('Katana konuştu, katır sustu.', 640, 196); c.restore(); }
  // fade
  const fo = t > LOOP_END - 1.2 ? clamp((t - (LOOP_END - 1.2)) / 1.1, 0, 1) : 0, fi = clamp(fadeIn, 0, 1);
  const fa = Math.max(fo, fi); if (fa > .005) { c.fillStyle = `rgba(0,0,0,${fa.toFixed(3)})`; c.fillRect(0, 0, W, H); }
}

// ---------------- ana döngü ----------------
function render() {
  const ctime = Math.min(T, 24.9);
  const cam = { cx: evalTrack(camTr.cx, ctime), cy: evalTrack(camTr.cy, ctime), z: evalTrack(camTr.z, ctime), bars: evalTrack(camTr.bars, ctime) };
  // sarsıntı
  const sh = fx.shake; cam.cx += rnd(-1, 1) * sh; cam.cy += rnd(-1, 1) * sh * .8;
  // grup anlatım: yüksek yerlerde ay ışığı vb. yok — saf çizim
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawScene(cam); drawUI(cam);
}
let last = 0, acc = 0, firstFrame = true;
function frame(ts) {
  const now = ts / 1000; let dt = Math.min(.05, now - last); last = now; if (firstFrame) { dt = 0; firstFrame = false; }
  realNow = now;
  if (!paused) {
    let ts_ = 1;
    if (fx.slowDur > 0) { const u = (realNow - fx.slowT0) / fx.slowDur; if (u >= 1) fx.slowDur = 0; else if (u >= 0) { const e = Math.min(1, u / .08) * (u > .72 ? 1 - (u - .72) / .28 : 1); ts_ = lerp(1, fx.slowVal, clamp(e, 0, 1)); } }
    acc += dt * ts_;
    let n = 0; while (acc >= STEP && n < 40) { step(STEP); acc -= STEP; n++; }
    fx.flash *= Math.exp(-7 * dt); fx.shake *= Math.exp(-8 * dt); fx.sl *= Math.exp(-6 * dt);
    fadeIn = Math.max(0, fadeIn - dt * (T < 1.5 ? .7 : 1.2));
    for (const f of F) { f.hpShow = lerp(f.hpShow, f.hp, 1 - Math.exp(-14 * dt)); f.hpTrail = f.hpTrail > f.hp ? Math.max(f.hp, f.hpTrail - 22 * dt * (realNow % 1 < 2 ? 1 : 1)) : f.hp; }
    if (T > LOOP_END) { reset(); fadeIn = 1; }
  }
  render();
  requestAnimationFrame(frame);
}

function seek(t) {
  SILENT = true; const keepFade = fadeIn; reset();
  const n = Math.round(t / STEP); for (let i = 0; i < n; i++) step(STEP);
  for (const f of F) { f.hpShow = f.hp; f.hpTrail = f.hp; }
  fx.flash = 0; fx.shake = 0; fx.slowDur = 0; fx.invert = 0; fadeIn = t < 1 ? 1 - t : 0; acc = 0; SILENT = false;
}
window.seek = seek; window.__dbg = { get T() { return T; }, pause: v => { paused = v; } };

// ---------------- girdi ----------------
const hint = document.getElementById('hint');
setTimeout(() => { hint.style.opacity = 0; }, 9000);
function toggleSound() { const on = SFX.toggle(); hint.textContent = on ? '🔊 Ses açık · S ile kapat' : '🔇 Ses kapalı'; hint.style.opacity = .9; setTimeout(() => { hint.style.opacity = 0; }, 2500); }
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') { reset(); fadeIn = 1; }
  else if (e.key === 's' || e.key === 'S') toggleSound();
  else if (e.key === 'ArrowRight') seek(T + 1);
  else if (e.key === 'ArrowLeft') seek(Math.max(0, T - 1));
});
cv.addEventListener('pointerdown', () => { if (!SFX.on) toggleSound(); else paused = !paused; });

buildBG(); reset();
const qs = new URLSearchParams(location.search);
if (qs.has('t')) { seek(parseFloat(qs.get('t'))); paused = true; if (qs.has('go')) paused = false; hint.style.opacity = 0; }
requestAnimationFrame(frame);
})();
</script>
